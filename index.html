<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/siteIcon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System</title>
  </head>
  <body>
      <!-- ============================================================
           LOADING OVERLAY
           Hides the parchment/3D scene while it boots (scene setup,
           nodes.json fetch, TreeNode/StarModel construction, and each
           node's texture load). Driven by loadingProgress.js, wired up
           in main.js. Removed from the DOM once finishLoading() runs
           (either normal completion or the hard-timeout fallback).
           ============================================================ -->
      <div id="loadingOverlay">
        <div class="loading-card">
          <div class="loading-spinner"></div>
          <h1 class="loading-title">Ładowanie Drzewka Umiejętności…</h1>
          <div class="loading-barTrack">
            <div class="loading-barFill" id="loadingBarFill"></div>
          </div>
          <p class="loading-status" id="loadingStatus">Przygotowywanie sceny…</p>
        </div>
      </div>

      <noscript>
        You need to enable JavaScript to run this.
      </noscript>
      
      <div class="tab">
        <button class="tablinks" onclick="openTab(event, 'skillTree')">Drzewko Umiejętności</button>
        <button class="tablinks" onclick="openTab(event, 'character')">Karta Postaci</button>
        <button class="tablinks" onclick="openTab(event, 'equipment')">Karta Ekwipunku</button>
        <button class="tablinks" onclick="openTab(event, 'arcana')">Arkana</button>
        <button class="tablinks" onclick="openTab(event, 'manual')">Instrukcja Obsługi</button>
      </div>

      <div id="skillTree" class="tabcontent">
        <div id ="wrap">
          <div id="bor">
            <div id="canvas"></div>
          </div>
          <div id="text">
            <p>
              <span id="nodeName">Wybierz Cuś</span>
            </p>
            <p>
              <span id="nodeDesc">Opis cusia</span>
            </p>
            <p>
              <span id="nodeCost">Koszt Cusia</span>
            </p>
            <p>
              Dostępny potencjał: <span id="perkPoints">Punkty</span> punktów.
            </p>
          </div>
          </div>
      </div>

      <div id="character" class="tabcontent">
        <div id ="characterWrapper">
          <div id = "characterPage">
          </div>
        </div>
      </div>

      <div id="equipment" class="tabcontent">
        <div id ="equipmentWrapper">
          <div id="equipmentPage"></div>
        </div>
      </div>

      <div id="arcana" class="tabcontent">
        <div id ="arcanaWrapper">
          <div id="arcanaPage"></div>
        </div>
      </div>

      <div id="manual" class="tabcontent">
        <div id ="manualWrapper">
          <div id="manualPage"></div>
        </div>
      </div>

      <script>
        function openTab(evt, tabName) {
          var i, tabcontent, tablinks;
          tabcontent = document.getElementsByClassName("tabcontent");
          for (i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = "none";
          }
          tablinks = document.getElementsByClassName("tablinks");
          for (i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(" active", "");
          }
          document.getElementById(tabName).style.display = "block";
          if(evt != undefined) {evt.currentTarget.className += " active"};
        }
        openTab(event, 'skillTree')
        </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
